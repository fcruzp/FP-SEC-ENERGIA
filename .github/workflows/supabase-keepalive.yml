# Protege el proyecto de Supabase: lo mantiene despierto y lo respalda.
#
# POR QUÉ EXISTE: en el plan gratuito Supabase PAUSA el proyecto tras 7 días sin actividad, y uno
# pausado mucho tiempo puede no restaurarse. Ya se perdió una base entera (el proyecto anterior,
# vdkifczcjezcfqmdzkow). Sin copias propias, perder la cuenta es perder los datos.
#
# Secrets: deben ser REPOSITORY secrets (Settings → Secrets and variables → Actions → pestaña
# "Secrets" → New repository secret). Los Environment secrets NO los ve este workflow.
#   SUPABASE_URL       https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  clave pública (anon o sb_publishable_…)
#   SUPABASE_DB_URL    cadena del «Session pooler», puerto 5432 (solo para el backup)
# Guía completa (de dónde sale cada secret, descargar y restaurar): docs/RESPALDO-SUPABASE.md
#
# Para probar: Actions → «Supabase keep-alive y backup» → Run workflow (corre ambos trabajos).
# NO uses «Re-run jobs» de una ejecución vieja: re-ejecuta el commit viejo, con el workflow viejo.
# Los cron solo corren desde la rama por defecto (main).
name: Supabase keep-alive y backup

on:
  schedule:
    # Los cron de GitHub van en UTC. República Dominicana es UTC−4 todo el año (sin horario de verano).
    - cron: '17 11 * * *'   # keep-alive: todos los días a las 07:17 hora de RD
    - cron: '47 11 * * 1'   # backup: los lunes a las 07:47 hora de RD
  workflow_dispatch:

# Nada de esto escribe en el repositorio: el backup se guarda como artefacto, no como commit
permissions:
  contents: read

jobs:
  keepalive:
    # El lunes también corre: la consulta diaria es la que cuenta como actividad
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 11 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consulta liviana con la clave pública (+ centinela de RLS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # La tabla y el porqué del centinela están documentados en el script: si users se abre a
        # propósito, cambia KEEPALIVE_TABLE a otra tabla cerrada; NO quites la comprobación.
        run: bash scripts/ci/supabase-keepalive.sh
      - name: Latido con escritura real en Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # Supabase avisó de una pausa aunque la consulta REST respondía 200 a diario: una lectura vacía
        # puede no contar como actividad. Una escritura sí. El psql que trae el runner basta para esto.
        run: bash scripts/ci/supabase-heartbeat.sh

  backup:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 11 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Postgres vacío y desechable para RESTAURAR la copia y comprobar que sirve.
      # Debe ser de la misma versión mayor que el servidor de Supabase (hoy 17).
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar el cliente de Postgres de la versión del servidor
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # El runner trae un pg_dump más viejo que el servidor y pg_dump se niega con
        # "server version mismatch". Se pregunta la versión al servidor (psql del runner basta para eso)
        # y se instala esa misma versión desde el repositorio oficial pgdg.
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL (REPOSITORY secret, cadena del Session pooler)."; exit 1
          fi
          major="$(psql "$SUPABASE_DB_URL" -X -tA -c 'show server_version_num' | awk '{print int($1/10000)}')"
          echo "Servidor Postgres ${major}"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${major}"
          echo "/usr/lib/postgresql/${major}/bin" >> "$GITHUB_PATH"

      - name: pg_dump, verificación y restauración de prueba
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESTORE_TEST_URL: postgresql://postgres:restore@localhost:5433/postgres
          OUT_DIR: backup
        run: bash scripts/ci/supabase-backup.sh

      - name: Guardar la copia como artefacto (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup/*.sql.gz
          retention-days: 90
          if-no-files-found: error   # una copia que no se guardó es un fallo, no un aviso
